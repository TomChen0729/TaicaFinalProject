<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實戰英語對話</title>
    <link rel="stylesheet" href="css/index.css">

</head>
<body class="home-body ">
    <nav class="top-navbar">
        <div class="nav-left">
            <a href="index.html" class="btn-back">⬅️ 返回首頁</a>
            <div class="page-title">🗣️ 口說訓練大廳</div>
        </div>
    </nav>
    <div class="chat-container">
        <div class="chat-header" id="ui-header">載入中...</div>
        <div class="task-hint" id="ui-task">載入任務中...</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai" id="ui-greeting">Loading...</div>
        </div>

        <div class="chat-controls">
            <button id="recordButton">按住說話 (Hold to Speak)</button>
            <div id="statusText">等待錄音...</div>
        </div>
    </div>

    <script src="js/index.js" defer></script>
</body>
</html>

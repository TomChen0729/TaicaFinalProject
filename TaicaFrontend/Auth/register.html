<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊 - 實用英語生存指南</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>建立帳號 👤</h2>
        <p class="auth-subtitle">加入平台，開啟專屬英語對話關卡</p>

        <form id="registerForm">
            <div class="form-group">
                <label>使用者名稱 (Name)</label>
                <input type="text" id="name" required placeholder="例如：TomChen">
            </div>
            <div class="form-group">
                <label>電子郵件 (Email)</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>密碼 (Password)</label>
                <input type="password" id="password" required placeholder="至少 6 位數密碼">
            </div>
            <div class="form-group">
                <label>確認密碼 (Confirm Password)</label>
                <input type="password" id="password_confirmation" required placeholder="請再次輸入密碼">
            </div>
            <button type="submit" class="auth-btn">送出註冊</button>
        </form>

        <div class="auth-footer">
            已經有帳號了？ <a href="login.html">立即登入</a> | <a href="../index.html">返回首頁</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirmation = document.getElementById('password_confirmation').value;

            if (password !== password_confirmation) {
                alert('兩次輸入的密碼不一致！');
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password, password_confirmation })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || '註冊失敗');
                }

                // 註冊成功後直接自動登入，寫入 Token
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user_name', data.user.name);

                alert('註冊成功並已自動登入！');
                window.location.href = '../index.html';

            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
